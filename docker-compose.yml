services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raaga-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db.toxmcpcnpfapplzpztit.supabase.co:5432/postgres}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    env_file:
      - .env
    restart: unless-stopped
