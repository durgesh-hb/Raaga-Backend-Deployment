<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAAGA — Signing you in...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; padding: 2rem; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #1DB954;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 500; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #b3b3b3; }
    .fallback { margin-top: 2rem; display: none; }
    .fallback a {
      display: inline-block;
      background: #1DB954;
      color: #000;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Signing you in...</h1>
    <p>Redirecting back to RAAGA</p>
    <div class="fallback" id="fallback">
      <p style="margin-bottom: 1rem;">If the app didn't open automatically:</p>
      <a id="fallback-link" href="#">Open RAAGA</a>
    </div>
  </div>

  <script>
    /**
     * OAuth Redirect Bridge for RAAGA Android/iOS App
     *
     * Supabase redirects here after Google OAuth with tokens in the URL hash fragment:
     *   https://...onrender.com/auth/mobile-callback#access_token=...&refresh_token=...
     *
     * This page reads the hash and redirects to the custom scheme:
     *   raaga://login-callback#access_token=...&refresh_token=...
     *
     * The Android intent filter catches raaga:// and Capacitor's appUrlOpen event fires.
     */
    (function () {
      var CUSTOM_SCHEME = 'raaga://login-callback';
      var hash = window.location.hash || '';
      var deepLink = CUSTOM_SCHEME + hash;

      // Set fallback link immediately
      var fallbackLink = document.getElementById('fallback-link');
      if (fallbackLink) fallbackLink.href = deepLink;

      // Attempt redirect to the app
      window.location.href = deepLink;

      // Show fallback button after 3 seconds if the page is still visible
      setTimeout(function () {
        var fb = document.getElementById('fallback');
        if (fb) fb.style.display = 'block';
      }, 3000);
    })();
  </script>
</body>
</html>
